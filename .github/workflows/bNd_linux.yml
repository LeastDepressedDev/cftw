name: Build and test
env:
  ARTIFACT_FOLDER: cftw
  VERSION: "0.0.1"

on:
  push:
    branches: [ "dev", "release", "core_cicd" ]
  pull_request:
    branches: [ "dev", "release" ]


  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Installing defaults
        run: |
          sudo apt update
          sudo apt install python3 -y tree cmake clang rustc

      
      - name: Compiling bmplib
        run: ./.github/building/b_lib.sh


      - name: Moving artifacts
        run: ./.github/building/m_lib_to_cli.sh
        

      - name: Compiling core_cli
        run: ./.github/building/b_cli.sh


      - name: Building ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }} directory
        run: |
          mkdir ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }} &&
          cp -v cli/build/cftw-cli ./${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }} &&
          cp -v tests/dtest_* ./${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }} &&
          cd ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }} &&
          git clone https://github.com/LeastDepressedDev/decktests.git &&
          mv -v decktests repo_decktests &&
          mv -v repo_decktests/decktest . && rm -vr repo_decktests &&

          tree .

      - name: Saving ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }} dir
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}
          path: ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}

  cli-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Using pre-built directory
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}
          path: ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}

      - name: Preparing
        run: chmod +x ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}/cftw-cli 

      - name: Runing tests
        run: cd ${{ env.ARTIFACT_FOLDER }} && python3 dtest_*


  deploy_latest:
    runs-on: ubuntu-latest
    needs: [ build ]
    if: github.ref == 'refs/heads/core_cicd'

    steps:
      # Key: Download artifacts from the same workflow run
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}
          path: ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}
      
      # Deploy to server via SCP (example)
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.ARTIFACT_FOLDER }}_v${{ env.VERSION }}
          target: "/var/www/app"