name: Build and test

on:
  push:
    branches: [ "dev", "release", "core_cicd" ]
  pull_request:
    branches: [ "dev", "release" ]


  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Installing defaults
        run: |
          sudo apt update
          sudo apt install python3 -y tree cmake clang rustc

      
      - name: Compiling bmplib
        run: ./.github/building/b_lib.sh


      - name: Moving artifacts
        run: ./.github/building/m_lib_to_cli.sh
        

      - name: Compiling core_cli
        run: ./.github/building/b_cli.sh


      - name: Building tests/runtime directory
        run: |
          mkdir __runtime &&
          cp -v cli/build/cftw-cli ./__runtime &&
          cp -v tests/dtest_* ./__runtime &&
          cd __runtime &&
          git clone https://github.com/LeastDepressedDev/decktests.git &&
          mv -v decktests repo_decktests &&
          mv -v repo_decktests/decktest . && rm -vr repo_decktests &&

          tree .

      - name: Saving __runtime dir
        uses: actions/upload-artifact@v4
        with:
          name: __runtime
          path: __runtime

  cli-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Using pre-built directory
        uses: actions/download-artifact@v4
        with:
          name: __runtime
          path: __runtime

      - name: Preparing
        run: chmod +x __runtime/cftw-cli 

      - name: Runing tests
        run: cd __runtime && python3 dtest_*

